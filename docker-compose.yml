services:
  bedrock:
    image: itzg/minecraft-bedrock-server:latest
    container_name: mystery-bedrock
    restart: unless-stopped

    # Needed so `docker attach` gives you an interactive BDS console.
    stdin_open: true
    tty: true

    ports:
      - "${SERVER_PORT:-19132}:${SERVER_PORT:-19132}/udp"
      - "${SERVER_PORT_V6:-19133}:${SERVER_PORT_V6:-19133}/udp"

    volumes:
      # Server binary, server.properties, allowlist.json and worlds/ all live here.
      - ./data:/data
      # Drop .mcworld / .mcaddon / .mcpack files here and point MC_PACK at them.
      - ./packs:/packs:ro

    environment:
      EULA: "TRUE"
      VERSION: "${VERSION:-LATEST}"
      TZ: "${TZ:-UTC}"

      SERVER_NAME: "${SERVER_NAME:-Murder Mystery Escape}"
      LEVEL_NAME: "${LEVEL_NAME:-mystery}"
      LEVEL_SEED: "${LEVEL_SEED:-}"
      LEVEL_TYPE: "${LEVEL_TYPE:-flat}"

      GAMEMODE: "${GAMEMODE:-creative}"
      DIFFICULTY: "${DIFFICULTY:-peaceful}"
      ALLOW_CHEATS: "${ALLOW_CHEATS:-true}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      DEFAULT_PLAYER_PERMISSION_LEVEL: "${DEFAULT_PLAYER_PERMISSION_LEVEL:-operator}"

      ONLINE_MODE: "${ONLINE_MODE:-true}"
      ALLOW_LIST: "${ALLOW_LIST:-false}"
      ALLOW_LIST_USERS: "${ALLOW_LIST_USERS:-}"
      OPS: "${OPS:-}"
      MEMBERS: "${MEMBERS:-}"
      VISITORS: "${VISITORS:-}"

      VIEW_DISTANCE: "${VIEW_DISTANCE:-16}"
      TICK_DISTANCE: "${TICK_DISTANCE:-4}"
      PLAYER_IDLE_TIMEOUT: "${PLAYER_IDLE_TIMEOUT:-0}"
      TEXTUREPACK_REQUIRED: "${TEXTUREPACK_REQUIRED:-false}"

      SERVER_PORT: "${SERVER_PORT:-19132}"
      SERVER_PORT_V6: "${SERVER_PORT_V6:-19133}"

      # Import a map/addon archive from ./packs on startup. Leave empty for a fresh world.
      MC_PACK: "${MC_PACK:-}"
      FORCE_WORLD_COPY: "${FORCE_WORLD_COPY:-false}"

      # Warn players before a `docker compose stop` actually kills the server.
      STOP_SERVER_ANNOUNCE_DELAY: "${STOP_SERVER_ANNOUNCE_DELAY:-10}"

    # BDS is single-threaded-ish; this is a ceiling, not a reservation.
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2g}
